---
# Minimal Roblox globals for offline Selene (the official API dump could not be downloaded:
# network policy). Values are typed "any": this lints Luau usage, not Roblox API correctness.
base: luau
name: roblox_min
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  Enum: { any: true }
  Instance: { any: true }
  Vector3: { any: true }
  Vector2: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  TweenInfo: { any: true }
  RaycastParams: { any: true }
  OverlapParams: { any: true }
  PhysicalProperties: { any: true }
  task: { any: true }
  warn: { args: [{ type: "..." }] }
  typeof: { args: [{ type: any }] }
